#   cmd: esub $[scripts_dir]/$[executable1] --tasks='0 > 1' --n_jobs=1 --main_n_cores_per_job=20 --main_gpu=1 --main_gpu_memory=20000 --main_memory=4096 --main_time=4 --mode=jobarray --function=main --system=slurm --verbosity=info --training_data_file=$[data] --path_output=$[out] --ntrain=$[ntrain] --epochs=$[epochs] --spectrum=TE_lensed --model_name=te_lensed --pca_preprocess --npca=512

